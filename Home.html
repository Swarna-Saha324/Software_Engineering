<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Recommendation System</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Georgia", serif;
    }

    body {
      height: 100vh;
      background: url("https://media.licdn.com/dms/image/v2/D5612AQGy6sM0SJAdxg/article-cover_image-shrink_720_1280/article-cover_image-shrink_720_1280/0/1693150322893?e=2147483647&v=beta&t=2_aostRG53XjmjiS9FSI9Jcfn73tsoq3uFate9rV0XE") 
      no-repeat center center fixed;
      background-size: cover;
      position: relative;
      color: white;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 0;
    }

    nav {
      width: 100%;
      height: 80px;
      background-color: #7d0606;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    nav h1 {
      font-size: 1.8rem;
      font-weight: 700;
    }

    /* 🔴 Updated Text Style (Image look) */
    nav h1 a {
      text-decoration: none;
      color: #ffffff;
      font-style: italic;
      font-weight: 600;
      font-size: 1.5rem;
      letter-spacing: 1px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 25px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .content {
      position: relative;
      z-index: 2;
      top: 35%;
      left: 10%;
      max-width: 600px;
    }

    .content p {
      font-size: 2rem;
      line-height: 1.5;
      font-weight: 600;
    }

    .highlight {
      color: #f2b6b6;
    }

    .continue {
      display: inline-block;
      margin-top: 20px;
      font-size: 1.2rem;
      color: #ddd;
      font-style: italic;
      cursor: pointer;
      text-decoration: underline;
    }

    .form-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 5;
    }

    .form-box {
      background: #fff;
      color: #333;
      padding: 30px 40px;
      border-radius: 12px;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .form-box h2 {
      margin-bottom: 15px;
      font-size: 1.4rem;
      color: #7d0606;
    }

    .form-box input {
      width: 100%;
      padding: 10px;
      margin: 10px 0 20px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }

    .form-box button {
      background: #7d0606;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    .form-box button:hover {
      background:#7d0606;
    }

    .close-btn {
      margin-top: 10px;
      display: inline-block;
      cursor: pointer;
      color: #7d0606;
      font-size: 0.9rem;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav>
    <h1><a href="#">Movie Recommendation System</a></h1>
    <ul>
      <li><a id="homeLink">Home</a></li>
      <li><a href="Login.html">Login</a></li>
    </ul>
  </nav>

  <div class="content">
    <p>"Stop searching,<br>
    start watching<br>
    <span class="highlight">personalized recommendations just for you</span>"</p>
    <span class="continue" id="openForm">— To be continue</span>
  </div>

   <div class="form-container" id="formContainer">
    <div class="form-box">
      <h2>Enter Your Username</h2>
      <form id="userForm" method="POST" action="save_user.php">
        <input type="text" id="username" name="username" placeholder="Username" required>
        <button type="submit" a href="Movie_Recommendations.html">Submit</button>
      </form>
      <span class="close-btn" id="closeForm">Close</span>
    </div>
  </div> 

  <script>
    const openFormBtn = document.getElementById("openForm");
    const closeFormBtn = document.getElementById("closeForm");
    const formContainer = document.getElementById("formContainer");
    const homeLink = document.getElementById("homeLink");

    openFormBtn.addEventListener("click", () => {
      formContainer.style.display = "flex";
    });

    closeFormBtn.addEventListener("click", () => {
      formContainer.style.display = "none";
    });

    homeLink.addEventListener("click", () => {
      formContainer.style.display = "flex";
    });
  </script>
</body>
</html>
